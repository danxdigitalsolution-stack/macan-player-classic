name: Build

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }} | ${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64, Win32]

    env:
      SOLUTION_FILE: mpc-hc.sln

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSYS2 (required for internal codecs / LAV Filters build)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-toolchain
            yasm
            nasm

      - name: Create build.user.bat
        shell: cmd
        run: |
          echo SET MPCHC_MSYS_PATH=D:\a\_temp\msys64> build.user.bat
          echo SET MPCHC_MSYS_TOOLCHAIN=mingw64>> build.user.bat

      - name: Restore NuGet packages
        shell: cmd
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build
        shell: cmd
        run: |
          msbuild ${{ env.SOLUTION_FILE }} ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=${{ matrix.platform }} ^
            /m /v:minimal

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $outDir = Get-ChildItem -Path "bin" -Recurse -Directory -Filter "*${{ matrix.configuration }}*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($outDir) {
            echo "output_dir=$($outDir.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            echo "output_dir=bin" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macan-player-classic-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            ${{ steps.locate.outputs.output_dir }}/**/*.exe
            ${{ steps.locate.outputs.output_dir }}/**/*.dll
          if-no-files-found: warn
          retention-days: 14

  installer:
    name: Build Installer
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer script
        shell: cmd
        run: |
          iscc "distrib\mpc-hc_setup.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macan-player-classic-installer
          path: distrib/*.exe
          if-no-files-found: warn
