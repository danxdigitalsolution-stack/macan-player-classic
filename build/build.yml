name: Build

on:
  push:
    branches:
      - develop
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }} | ${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64, Win32]

    env:
      SOLUTION_FILE: mpc-hc.sln

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSYS2 (required for internal codecs / LAV Filters build)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-toolchain
            yasm
            nasm

      - name: Create build.user.bat
        shell: cmd
        run: |
          echo SET MPCHC_MSYS_PATH=D:\a\_temp\msys64> build.user.bat
          echo SET MPCHC_MSYS_TOOLCHAIN=mingw64>> build.user.bat

      - name: Restore NuGet packages
        shell: cmd
        run: nuget restore ${{ env.SOLUTION_FILE }}

      - name: Build
        shell: cmd
        run: |
          msbuild ${{ env.SOLUTION_FILE }} ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=${{ matrix.platform }} ^
            /m /v:minimal

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $outDir = Get-ChildItem -Path "bin" -Recurse -Directory -Filter "*${{ matrix.configuration }}*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($outDir) {
            echo "output_dir=$($outDir.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            echo "output_dir=bin" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macan-player-classic-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            ${{ steps.locate.outputs.output_dir }}/**/*.exe
            ${{ steps.locate.outputs.output_dir }}/**/*.dll
          if-no-files-found: warn
          retention-days: 14

  build-video-converter:
    name: Build MacanVideoConverter.exe
    runs-on: windows-latest

    env:
      # Sesuaikan kalau lokasi video_convert.py di repo kamu beda.
      SCRIPT_PATH: tools/video_convert.py
      ICON_PATH: tools/macan_video_converter.ico
      # ffmpeg.exe & ffprobe.exe di root project (dipakai langsung, tanpa
      # media_tools). Sesuaikan kalau lokasinya beda.
      FFMPEG_PATH: tools/ffmpeg.exe
      FFPROBE_PATH: tools/ffprobe.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6

      - name: Build MacanVideoConverter.exe
        shell: pwsh
        run: |
          $iconArg = @()
          if (Test-Path "${{ env.ICON_PATH }}") {
            $iconArg = @("--icon=${{ env.ICON_PATH }}")
          }
          $binaryArgs = @()
          if (Test-Path "${{ env.FFMPEG_PATH }}") {
            $binaryArgs += "--add-binary=${{ env.FFMPEG_PATH }};."
          }
          if (Test-Path "${{ env.FFPROBE_PATH }}") {
            $binaryArgs += "--add-binary=${{ env.FFPROBE_PATH }};."
          }
          pyinstaller --noconfirm --onefile --windowed `
            --name MacanVideoConverter `
            @iconArg `
            @binaryArgs `
            "${{ env.SCRIPT_PATH }}"

      - name: Upload MacanVideoConverter artifact
        uses: actions/upload-artifact@v4
        with:
          name: macan-video-converter
          path: dist/MacanVideoConverter.exe
          if-no-files-found: error
          retention-days: 14

  installer:
    name: Build Installer
    needs: [build, build-video-converter]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place MacanVideoConverter.exe next to player exe
        shell: pwsh
        run: |
          # Sesuaikan "distrib" kalau folder staging installer-nya beda.
          Copy-Item "artifacts/macan-video-converter/MacanVideoConverter.exe" -Destination "distrib/MacanVideoConverter.exe" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer script
        shell: cmd
        run: |
          iscc "distrib\mpc-hc_setup.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macan-player-classic-installer
          path: distrib/*.exe
          if-no-files-found: warn
